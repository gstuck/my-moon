function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}

function resizeDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> reject(new Error('image load failed'));
    img.src = dataUrl;
  });
}

function moveResult(resultId, targetTestId){
  const r = RESULTS.find(x=>x.id===resultId);
  if(!r) return;
  const oldTestId = r.testId;
  let newTestId = targetTestId;
  if(targetTestId === '__new__'){
    newTestId = uid();
    CATALOG.push({ id: newTestId, name: r.rawLabel || 'Untitled test', aliases: r.rawLabel ? [r.rawLabel] : [], domain: 'Uncategorized', subdomain: 'General', unit: r.unit || '', refLow: r.refLow, refHigh: r.refHigh, rangeNote: '', tags: [] });
  } else {
    const newCat = CATALOG.find(c=>c.id===newTestId);
    if(newCat && r.rawLabel && !newCat.aliases.some(a=>normalize(a)===normalize(r.rawLabel))) newCat.aliases.push(r.rawLabel);
  }
  const oldCat = CATALOG.find(c=>c.id===oldTestId);
  if(oldCat && r.rawLabel){
    const stillUsed = RESULTS.some(x=>x.id!==r.id && x.testId===oldTestId && normalize(x.rawLabel)===normalize(r.rawLabel));
    if(!stillUsed) oldCat.aliases = oldCat.aliases.filter(a=>normalize(a)!==normalize(r.rawLabel));
  }
  r.testId = newTestId;
  saveCatalog(); saveResults();
  movingResultId = null;
  render();
}

  const r = RESULTS.find(x=>x.id===resultId);

  const v = parseFloat(newValue);

  r.value = v;
  r.valueRaw = newValue.trim();
  r.unit = newUnit || '';
  r.refLow = newRefLow!==''? parseFloat(newRefLow): null;
  r.refHigh = newRefHigh!==''? parseFloat(newRefHigh): null;
  r.flag = '';
  saveResults();
  editingResultId = null;
  render();
}

function normalize(s){ return (s||'').toLowerCase().replace(/[().,]/g,' ').replace(/\s+/g,' ').trim(); }
function tokenSet(s){ return new Set(normalize(s).split(' ').filter(Boolean)); }
function jaccard(a,b){ const inter=[...a].filter(x=>b.has(x)).length; const uni=new Set([...a,...b]).size; return uni? inter/uni : 0; }

function findExactMatch(label){
  const n = normalize(label);
  for(const t of CATALOG){
    if(normalize(t.name) === n) return t;
    if(t.aliases.some(a=>normalize(a)===n)) return t;
  }
  return null;
}
function findCandidates(label){
  const ts = tokenSet(label);
  return CATALOG.map(t=>{
    let best = 0;
    const check = (other)=>{
      const os = tokenSet(other);
      const inter = [...ts].filter(x=>os.has(x));
      const score = jaccard(ts, os);
      const strong = inter.length >= 2 || (inter.length===1 && inter[0].length >= 5 && score >= 0.3);
      if(strong && score > best) best = score;
    };
    check(t.name);
    for(const a of t.aliases) check(a);
    return {test:t, score:best};
  }).sort((a,b)=>b.score-a.score).filter(c=>c.score>0).slice(0,4);
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(r.result.split(',')[1]);
    r.onerror = ()=> rej(new Error('read failed'));
    r.readAsDataURL(file);
  });
}

function isHeic(file){
  const t = (file.type||'').toLowerCase();
  const n = (file.name||'').toLowerCase();
  return t.includes('heic') || t.includes('heif') || n.endsWith('.heic') || n.endsWith('.heif');
}

let heicToPromise = null;
function loadHeicTo(){
  if(window.HeicTo) return Promise.resolve();
  if(heicToPromise) return heicToPromise;
  heicToPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js';
    s.onload = ()=> resolve();
    s.onerror = ()=> reject(new Error('HEIC converter failed to load'));
    document.head.appendChild(s);
  });
  return heicToPromise;
}

async function browserHeicConvert(file){
  await loadHeicTo();
  const jpegBlob = await window.HeicTo({ blob: file, type: 'image/jpeg', quality: 0.85 });
  return new File([jpegBlob], (file.name||'photo').replace(/\.(heic|heif)$/i,'.jpg'), { type: 'image/jpeg' });
}

async function extractFromImage(rawFile, appendMode){
  extracting = true; extractError=''; render();
  try {
    let b64, mediaType, extractionDataUrl = null, thumbDataUrl = null;

    // Tier 1: let the browser decode the photo itself. Works for JPEG/PNG always,
    // and for HEIC on any Apple device (iOS/Safari have native OS-level HEIC support) --
    // no library download, no server round-trip.
    try { extractionDataUrl = await resizeImageFile(rawFile, 1568, 0.85); } catch(e){ extractionDataUrl = null; }

    // Tier 2: if that failed and it's a HEIC file, convert it right here in the browser
    // using a proper WASM decoder -- works on any OS/browser, and since it runs in the
    // browser (plenty of memory) rather than the server (a tight, fixed memory limit),
    // it isn't constrained the way the server-side fallback is.
    if(!extractionDataUrl && isHeic(rawFile)){
      try {
        const converted = await browserHeicConvert(rawFile);
        extractionDataUrl = await resizeImageFile(converted, 1568, 0.85);
      } catch(e){ extractionDataUrl = null; }
    }

    if(extractionDataUrl){
      b64 = extractionDataUrl.split(',')[1];
      mediaType = 'image/jpeg';
      try { thumbDataUrl = await resizeDataUrl(extractionDataUrl, 1200, 0.72); } catch(e){ thumbDataUrl = extractionDataUrl; }
    } else {
      // Tier 3 (last resort): send the original to the server for conversion.
      // Only reached if the browser truly could not decode this file at all.
      b64 = await fileToBase64(rawFile);
      mediaType = isHeic(rawFile) ? 'image/heic' : (rawFile.type || 'image/jpeg');
    }

    const { data: fnData, error: fnError } = await sb.functions.invoke('extract-labs', {
      body: { imageBase64: b64, mediaType }
    });
    if(fnError) throw fnError;
    const payload = typeof fnData === 'string' ? JSON.parse(fnData) : fnData;
    if(payload.error) throw new Error(payload.error);
    const parsed = payload.extraction || payload;

    if(!thumbDataUrl){
      try {
        if(payload.convertedJpegBase64){
          thumbDataUrl = await resizeDataUrl('data:image/jpeg;base64,'+payload.convertedJpegBase64, 1200, 0.72);
        }
      } catch(e){ thumbDataUrl = null; }
    }

    const newRows = buildRowsFromParsed(parsed);
    if(appendMode && pendingExtraction){
      pendingExtraction.rows = pendingExtraction.rows.concat(newRows);
      if(thumbDataUrl) pendingExtraction.photos.push(thumbDataUrl);
    } else {
      pendingExtraction = {
        reportDate: parsed.collectedDate || parsed.reportDate || '',
        reportedDate: parsed.reportedDate || '',
        orderingPhysician: parsed.orderingPhysician || '',
        facility: parsed.facility || '',
        sourceNotes: parsed.notes || '',
        contextNotes: '',
        photos: thumbDataUrl ? [thumbDataUrl] : [],
        rows: newRows
      };
    }
  } catch(e){
    extractError = 'Could not read this image. Try a clearer or better-lit photo, or crop to the results section, then try again. (' + (e.message||e) + ')';
    pendingExtraction = null;
  }
  extracting = false;
  render();
}

    if(fnError) throw fnError;
    const payload = typeof fnData === 'string' ? JSON.parse(fnData) : fnData;
    if(payload.error) throw new Error(payload.error);
    const ex = payload.extraction || payload;

    if(!thumbDataUrl){
      try {
        if(payload.convertedJpegBase64){
          thumbDataUrl = await resizeDataUrl('data:image/jpeg;base64,'+payload.convertedJpegBase64, 1200, 0.72);
        }
      } catch(e){ thumbDataUrl = null; }
    }

    const newSignals = (ex.signals||[]).map(s=>({
      rowId: uid(),
      include: true,
      type: s.type || 'finding',
      domain: s.domain || '',
      subdomain: s.subdomain || '',
      structureTag: s.structureTag || '',
      regionTags: Array.isArray(s.regionTags) ? s.regionTags : [],
      isAncillary: !!s.isAncillary,
      isNegative: !!s.isNegative,
      text: s.text || '',
      measurementValue: s.measurementValue!=null ? String(s.measurementValue) : '',
      measurementUnit: s.measurementUnit || '',
      measurementLabel: s.measurementLabel || '',
      hasRecommendation: !!s.hasRecommendation,
      recommendationText: s.recommendationText || ''
    }));

    if(appendMode && pendingDocExtraction){
      pendingDocExtraction.signalRows = pendingDocExtraction.signalRows.concat(newSignals);
      if(thumbDataUrl) pendingDocExtraction.photos.push(thumbDataUrl);
    } else {
      pendingDocExtraction = {
        date: ex.date || '',
        reportedDate: ex.reportedDate || '',
        documentType: ex.documentType || '',
        orderingPhysician: ex.orderingPhysician || '',
        readingPhysician: ex.readingPhysician || '',
        additionalPhysicians: ex.additionalPhysicians || '',
        facility: ex.facility || '',
        accessionNumber: ex.accessionNumber || '',
        encounterId: ex.encounterId || '',
        indication: ex.indication || '',
        findingsText: ex.findingsText || '',
        impressionText: ex.impressionText || '',
        photos: thumbDataUrl ? [thumbDataUrl] : [],
        signalRows: newSignals
      };
    }
  } catch(e){
    docExtractError = 'Could not read this document. Try a clearer photo, or crop to the report text, then try again. (' + (e.message||e) + ')';
    pendingDocExtraction = null;
  }
  docExtracting = false;
  render();
}

function buildRowsFromParsed(parsed){
  return (parsed.tests||[]).map(t=>{
    const exact = findExactMatch(t.label);
    const candidates = exact ? [] : findCandidates(t.label);
    const confident = candidates.length && candidates[0].score >= 0.45;
    return {
      rowId: uid(),
      rawLabel: t.label || '',
      value: t.value != null ? String(t.value) : '',
      unit: t.unit || '',
      refLow: t.refRangeLow != null ? String(t.refRangeLow) : '',
      refHigh: t.refRangeHigh != null ? String(t.refRangeHigh) : '',
      flag: t.flag || '',
      include: true,
      matchMode: exact ? 'exact' : (confident ? 'suggest' : candidates.length ? 'weak' : 'new'),
      matchedTestId: exact ? exact.id : (confident ? candidates[0].test.id : '__new__'),
      candidates
    };
  });
}

function importPastedJson(appendMode){
  const el = root.querySelector('#lt-paste-json');
  const raw = el ? el.value.trim() : '';
  if(!raw){ extractError = 'IMPORT:Paste the extracted data block first.'; render(); return; }
  try {
    const clean = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    const newRows = buildRowsFromParsed(parsed);
    if(appendMode && pendingExtraction){
      pendingExtraction.rows = pendingExtraction.rows.concat(newRows);
    } else {
      pendingExtraction = {
        reportDate: parsed.collectedDate || parsed.reportDate || '',
        reportedDate: parsed.reportedDate || '',
        orderingPhysician: parsed.orderingPhysician || '',
        facility: parsed.facility || '',
        sourceNotes: parsed.notes || '',
        contextNotes: '',
        photos: [],
        rows: newRows
      };
    }
    extractError = '';
  } catch(e){
    extractError = 'IMPORT:That did not look like valid extracted data. Make sure you pasted the whole block Claude gave you.';
  }
  render();
}

async function saveExtraction(){
  if(!pendingExtraction) return;
  const rows = pendingExtraction.rows.filter(r=>r.include && r.rawLabel.trim() && r.value.trim());
  if(!rows.length){ return; }
  const orderId = uid();
  const photos = pendingExtraction.photos || [];
  ORDERS.push({
    id: orderId,
    date: pendingExtraction.reportDate || new Date().toISOString().slice(0,10),
    reportedDate: pendingExtraction.reportedDate || '',
    orderingPhysician: pendingExtraction.orderingPhysician || '',
    facility: pendingExtraction.facility || '',
    sourceNotes: pendingExtraction.sourceNotes || '',
    contextNotes: pendingExtraction.contextNotes || '',
    photoCount: photos.length,
    createdAt: new Date().toISOString()
  });
  if(photos.length) await savePhotosForOrder(orderId, photos);
  for(const r of rows){
    let testId = r.matchedTestId;
    if(testId === '__new__'){
      testId = uid();
      const rl = r.refLow!==''? parseFloat(r.refLow): null;
      const rh = r.refHigh!==''? parseFloat(r.refHigh): null;
      CATALOG.push({ id: testId, name: r.rawLabel.trim(), aliases:[r.rawLabel.trim()], domain: r.newDomain || 'Uncategorized', subdomain: r.newSubdomain || 'General', unit: r.unit || '', refLow: rl, refHigh: rh, rangeNote: '', tags: [] });
    } else {
      const cat = CATALOG.find(c=>c.id===testId);
      if(cat && !cat.aliases.some(a=>normalize(a)===normalize(r.rawLabel))) cat.aliases.push(r.rawLabel.trim());
    }
    RESULTS.push({
      id: uid(), orderId, testId,
      rawLabel: r.rawLabel.trim(),
      value: parseFloat(r.value), valueRaw: r.value.trim(),
      unit: r.unit || '',
      refLow: r.refLow!==''? parseFloat(r.refLow): null,
      refHigh: r.refHigh!==''? parseFloat(r.refHigh): null,
      flag: r.flag || ''
    });
  }
  await saveOrders(); await saveCatalog(); await saveResults();
  pendingExtraction = null;
  activeTab = 'results';
  render();
}

function computeFlag(r){
  if(r.flag) return r.flag.toUpperCase().startsWith('H') ? 'H' : r.flag.toUpperCase().startsWith('L') ? 'L' : 'normal';
  if(r.refLow!=null && !isNaN(r.value) && r.value < r.refLow) return 'L';
  if(r.refHigh!=null && !isNaN(r.value) && r.value > r.refHigh) return 'H';
  return 'normal';
}

function sparkline(values){
  if(values.length < 2) return '';
  const w=90,h=26,pad=3;
  const nums = values.map(v=>v.value).filter(v=>!isNaN(v));
  if(nums.length<2) return '';
  const min=Math.min(...nums), max=Math.max(...nums);
  const range = (max-min)||1;
  const pts = values.map((v,i)=>{
    const x = pad + (i/(values.length-1))*(w-2*pad);
    const y = h-pad - ((v.value-min)/range)*(h-2*pad);
    return {x,y,flag:v.flag};
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const dots = pts.map(p=>{
    const c = p.flag==='H'?HIGH:p.flag==='L'?LOW:TEAL;
    return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2" fill="${c}"/>`;
  }).join('');
  return `<svg width="${w}" height="${h}" style="display:block"><path d="${path}" fill="none" stroke="${LINE}" stroke-width="1.5"/>${dots}</svg>`;
}

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

}

        </label>
        <label style="font-size:12px;color:${SUB};">Facility
          <input type="text" id="lt-doc-facility" value="${esc(p.facility)}" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:13px;"/>
        </label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;">
        <label style="font-size:12px;color:${SUB};">Ordering physician
          <input type="text" id="lt-doc-ordering" value="${esc(p.orderingPhysician)}" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:13px;"/>
        </label>
        <label style="font-size:12px;color:${SUB};">Reading physician
          <input type="text" id="lt-doc-reading" value="${esc(p.readingPhysician)}" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:13px;"/>
        </label>
        <label style="font-size:12px;color:${SUB};">Other physician(s)
          <input type="text" id="lt-doc-additional" value="${esc(p.additionalPhysicians)}" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:13px;"/>
        </label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;">
        <label style="font-size:12px;color:${SUB};">Accession/reference #
          <input type="text" id="lt-doc-accession" value="${esc(p.accessionNumber)}" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:13px;"/>
        </label>
        <label style="font-size:12px;color:${SUB};">Encounter ID (if stated)
          <input type="text" id="lt-doc-encounter" value="${esc(p.encounterId)}" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:13px;"/>
        </label>
        <label style="font-size:12px;color:${SUB};">Indication / reason for exam
          <input type="text" id="lt-doc-indication" value="${esc(p.indication)}" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:13px;"/>
        </label>
      </div>
      <details style="margin-bottom:20px;">
        <summary style="font-size:12px;color:${SUB};cursor:pointer;">Full Findings / Impression text (from the document)</summary>
        <label style="font-size:11px;color:${SUB};display:block;margin-top:8px;">Findings
          <textarea id="lt-doc-findings" rows="4" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:12px;font-family:inherit;">${esc(p.findingsText)}</textarea>
        </label>
        <label style="font-size:11px;color:${SUB};display:block;margin-top:8px;">Impression
          <textarea id="lt-doc-impression" rows="3" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:12px;font-family:inherit;">${esc(p.impressionText)}</textarea>
        </label>
      </details>

      <div class="lt-head" style="font-size:15px;font-weight:600;margin-bottom:10px;">Signals (${p.signalRows.length})</div>
      ${p.signalRows.map(s=>renderSignalCard(s)).join('')}
      <button id="lt-add-signal-row" style="margin-top:6px;background:none;border:1px solid ${LINE};padding:6px 12px;border-radius:6px;font-size:12px;color:${INK};">+ Add signal</button>

      <div style="border:1px solid ${LINE};border-radius:8px;padding:14px;margin-top:20px;background:${CARD};">
        <div style="font-size:12px;font-weight:500;margin-bottom:2px;">More pages to this same document?</div>
        <input type="file" accept="image/*,.heic,.heif" id="lt-docfile-input-append" style="display:none"/>
        <button id="lt-docupload-append-btn" style="background:none;border:1px solid ${LINE};padding:6px 12px;border-radius:6px;font-size:12px;color:${INK};">+ Add page (photo)</button>
      </div>

      <div style="margin-top:24px;display:flex;gap:10px;">
        <button id="lt-save-doc-extraction" style="background:${TEAL};color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:500;">Save document</button>
        <button id="lt-cancel-doc-extraction" style="background:none;border:1px solid ${LINE};padding:10px 18px;border-radius:8px;font-size:14px;color:${INK};">Cancel</button>
      </div>
    </div>`;
  }
  return html;
}

  return `<div class="lt-signal-card" data-row="${s.rowId}" style="background:${CARD};border:1px solid ${LINE};border-radius:8px;padding:12px;margin-bottom:8px;${s.include?'':'opacity:0.5;'}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <input type="checkbox" class="lt-sig-include" data-row="${s.rowId}" ${s.include?'checked':''}/>
      <select class="lt-sig-type" data-row="${s.rowId}" style="background:${typeBg};color:${typeColor};border:1px solid ${LINE};border-radius:4px;padding:3px 6px;font-size:12px;">
        <option value="finding" ${s.type==='finding'?'selected':''}>Finding</option>
        <option value="diagnosis" ${s.type==='diagnosis'?'selected':''}>Diagnosis</option>

      <input type="text" class="lt-sig-domain" data-row="${s.rowId}" value="${esc(s.domain)}" placeholder="Domain" style="padding:5px 6px;border:1px solid ${LINE};border-radius:4px;font-size:12px;"/>
      <input type="text" class="lt-sig-subdomain" data-row="${s.rowId}" value="${esc(s.subdomain)}" placeholder="Subdomain" style="padding:5px 6px;border:1px solid ${LINE};border-radius:4px;font-size:12px;"/>
      <input type="text" class="lt-sig-structure" data-row="${s.rowId}" value="${esc(s.structureTag)}" placeholder="Structure (e.g. Left adrenal gland)" style="padding:5px 6px;border:1px solid ${LINE};border-radius:4px;font-size:12px;"/>

function renderResultsTab(){
  if(!RESULTS.length){
    return `<div style="max-width:480px;margin:60px auto;text-align:center;color:${SUB};font-size:14px;">
      No results yet. Add a lab report to start building the history.
    </div>`;
  }
  const orderById = Object.fromEntries(ORDERS.map(o=>[o.id,o]));
  const byDomain = {};
  for(const t of CATALOG){
    const has = RESULTS.some(r=>r.testId===t.id);
    if(!has) continue;
    byDomain[t.domain] = byDomain[t.domain] || {};
    byDomain[t.domain][t.subdomain] = byDomain[t.domain][t.subdomain] || [];
    byDomain[t.domain][t.subdomain].push(t);
  }
  let html = `<div style="max-width:1000px;margin:0 auto;padding:20px 16px 60px;">`;
  const sortAlnum = (a,b)=> a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'});
  for(const domain of Object.keys(byDomain).sort(sortAlnum)){
    html += `<div class="lt-head" style="font-size:15px;font-weight:600;margin:22px 0 8px;">${esc(domain)}</div>`;
    for(const subdomain of Object.keys(byDomain[domain]).sort(sortAlnum)){
      html += `<div style="font-size:12px;color:${SUB};text-transform:uppercase;letter-spacing:0.03em;margin:10px 0 6px;">${esc(subdomain)}</div>`;
      for(const t of byDomain[domain][subdomain].slice().sort((a,b)=>a.name.localeCompare(b.name))){
        const rsAll = RESULTS.filter(r=>r.testId===t.id).map(r=>({...r, order: orderById[r.orderId]})).sort((a,b)=>(a.order?.date||'').localeCompare(b.order?.date||''));
        const rsVisible = rsAll.filter(r=>!r.hidden);
        const hiddenCount = rsAll.length - rsVisible.length;
        const showHidden = showHiddenTests.has(t.id);
        const rs = rsVisible.length ? rsVisible : rsAll;
        const latest = rs[rs.length-1];
        const latestFlag = computeFlag(latest);
        const flagColor = latestFlag==='H'?HIGH:latestFlag==='L'?LOW:INK;
        const spark = sparkline(rs.map(r=>({value:r.value, flag:computeFlag(r)})));
        const isOpen = expandedTest===t.id;
        const detailRows = showHidden ? rsAll : rsVisible;
        html += `<div style="background:${CARD};border:1px solid ${LINE};border-radius:8px;margin-bottom:6px;overflow:hidden;">
          <div class="lt-test-row" data-test="${t.id}" style="display:flex;align-items:center;gap:14px;padding:10px 14px;cursor:pointer;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:500;">${esc(t.name)}</div>
              <div style="font-size:11px;color:${SUB};">${rs.length} result${rs.length>1?'s':''}${hiddenCount?' &middot; '+hiddenCount+' hidden':''}${t.unit?' &middot; '+esc(t.unit):''}${(t.refLow!=null||t.refHigh!=null)?' &middot; usual range '+(t.refLow!=null?t.refLow:'')+((t.refLow!=null&&t.refHigh!=null)?'-':'')+(t.refHigh!=null?t.refHigh:''):''}${t.rangeNote?' &middot; <span title="'+esc(t.rangeNote)+'" style="text-decoration:underline dotted;">tiered range</span>':''}${(t.tags&&t.tags.length)?' &middot; '+t.tags.map(g=>`<span style="background:${PAPER};border:1px solid ${LINE};border-radius:3px;padding:0 4px;margin-right:3px;">${esc(g)}</span>`).join(''):''}</div>
            </div>
            <div>${spark}</div>
            <div class="lt-mono" style="min-width:70px;text-align:right;font-size:14px;font-weight:500;color:${flagColor};">${esc(latest.valueRaw)}</div>
            <div style="font-size:11px;color:${SUB};min-width:80px;text-align:right;">${esc(latest.order?.date||'')}</div>
          </div>
          ${isOpen ? `<div style="border-top:1px solid ${LINE};padding:8px 14px;overflow-x:auto;" class="lt-scroll">
            ${hiddenCount ? `<div style="margin-bottom:6px;"><a href="#" class="lt-toggle-hidden" data-test="${t.id}" style="font-size:11px;color:${SUB};text-decoration:underline;">${showHidden ? 'Hide the '+hiddenCount+' hidden result'+(hiddenCount>1?'s':'') : 'Show '+hiddenCount+' hidden result'+(hiddenCount>1?'s':'')}</a></div>` : ''}
            <table style="width:100%;border-collapse:collapse;font-size:12px;">
              <thead><tr style="color:${SUB};text-align:left;"><th style="padding:4px 6px;">Date</th><th style="padding:4px 6px;">Value</th><th style="padding:4px 6px;">Ref range</th><th style="padding:4px 6px;">Flag</th><th style="padding:4px 6px;">Physician</th><th style="padding:4px 6px;">Facility</th><th style="padding:4px 6px;">Source notes</th><th style="padding:4px 6px;">Context notes</th><th style="padding:4px 6px;">Printed as</th><th style="padding:4px 6px;"></th></tr></thead>
              <tbody>
              ${detailRows.slice().reverse().map(r=>{
                const f = computeFlag(r); const fc = f==='H'?HIGH:f==='L'?LOW:SUB;
                const isMoving = movingResultId===r.id;
                const isEditing = isEditor && editingResultId===r.id;
                const isDeleting = isEditor && deletingResultId===r.id;
                const rowStyle = r.hidden ? `border-top:1px solid ${LINE};opacity:0.5;` : `border-top:1px solid ${LINE};`;
                const moveRow = isMoving ? `<tr style="border-top:1px solid ${LINE};background:${PAPER};"><td colspan="10" style="padding:8px 6px;">
                  <span style="font-size:12px;margin-right:6px;">Move this result to:</span>
                  <select class="lt-move-select" data-result="${r.id}" style="padding:4px 6px;border:1px solid ${LINE};border-radius:4px;font-size:12px;">
                    ${CATALOG.filter(c=>c.id!==t.id).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
                    <option value="__new__">+ Create new test: "${esc(r.rawLabel||'')}"</option>
                  </select>
                  <button class="lt-move-confirm" data-result="${r.id}" style="background:${TEAL};color:#fff;border:none;padding:5px 10px;border-radius:5px;font-size:12px;margin-left:6px;">Confirm move</button>
                  <button class="lt-move-cancel" style="background:none;border:1px solid ${LINE};padding:5px 10px;border-radius:5px;font-size:12px;margin-left:4px;">Cancel</button>
                </td></tr>` : '';
                const editRow = isEditing ? `<tr style="border-top:1px solid ${LINE};background:${PAPER};"><td colspan="10" style="padding:8px 6px;">
                  <span style="font-size:11px;color:${SUB};margin-right:4px;">Value</span><input type="text" class="lt-edit-value lt-mono" data-result="${r.id}" value="${esc(r.valueRaw)}" style="width:80px;padding:4px 6px;border:1px solid ${LINE};border-radius:4px;font-size:12px;margin-right:8px;"/>
                  <span style="font-size:11px;color:${SUB};margin-right:4px;">Unit</span><input type="text" class="lt-edit-unit" data-result="${r.id}" value="${esc(r.unit)}" style="width:80px;padding:4px 6px;border:1px solid ${LINE};border-radius:4px;font-size:12px;margin-right:8px;"/>
                  <span style="font-size:11px;color:${SUB};margin-right:4px;">Ref low</span><input type="text" class="lt-edit-reflow lt-mono" data-result="${r.id}" value="${r.refLow!=null?r.refLow:''}" style="width:60px;padding:4px 6px;border:1px solid ${LINE};border-radius:4px;font-size:12px;margin-right:8px;"/>
                  <span style="font-size:11px;color:${SUB};margin-right:4px;">Ref high</span><input type="text" class="lt-edit-refhigh lt-mono" data-result="${r.id}" value="${r.refHigh!=null?r.refHigh:''}" style="width:60px;padding:4px 6px;border:1px solid ${LINE};border-radius:4px;font-size:12px;margin-right:8px;"/>
                  <button class="lt-edit-confirm" data-result="${r.id}" style="background:${TEAL};color:#fff;border:none;padding:5px 10px;border-radius:5px;font-size:12px;margin-left:4px;">Save</button>
                  <button class="lt-edit-cancel" style="background:none;border:1px solid ${LINE};padding:5px 10px;border-radius:5px;font-size:12px;margin-left:4px;">Cancel</button>
                </td></tr>` : '';
                const deleteRow = isDeleting ? `<tr style="border-top:1px solid ${LINE};background:${HIGH_BG};"><td colspan="10" style="padding:8px 6px;">
                  <span style="font-size:12px;color:${HIGH};margin-right:8px;">Permanently delete this result? This can't be undone.</span>
                  <button class="lt-delete-confirm" data-result="${r.id}" style="background:${HIGH};color:#fff;border:none;padding:5px 10px;border-radius:5px;font-size:12px;margin-right:4px;">Delete permanently</button>
                  <button class="lt-delete-cancel" style="background:none;border:1px solid ${LINE};padding:5px 10px;border-radius:5px;font-size:12px;">Cancel</button>
                </td></tr>` : '';
                const actionButtons = !isEditor ? '' : r.hidden
                  ? `<button class="lt-unhide" data-result="${r.id}" style="background:none;border:1px solid ${LINE};padding:3px 8px;border-radius:4px;font-size:11px;color:${INK};margin-right:4px;">Unhide</button><button class="lt-delete-start" data-result="${r.id}" style="background:none;border:1px solid ${HIGH};padding:3px 8px;border-radius:4px;font-size:11px;color:${HIGH};">Delete</button>`
                  : `<button class="lt-edit-start" data-result="${r.id}" style="background:none;border:1px solid ${LINE};padding:3px 8px;border-radius:4px;font-size:11px;color:${INK};margin-right:4px;">Edit</button><button class="lt-move-start" data-result="${r.id}" style="background:none;border:1px solid ${LINE};padding:3px 8px;border-radius:4px;font-size:11px;color:${INK};margin-right:4px;">Move</button><button class="lt-hide" data-result="${r.id}" style="background:none;border:1px solid ${LINE};padding:3px 8px;border-radius:4px;font-size:11px;color:${INK};">Hide</button>`;
                return `<tr style="${rowStyle}"><td class="lt-mono"><a href="#" class="lt-goto-order" data-order="${r.orderId}" style="padding:4px 6px;display:block;color:${TEAL};text-decoration:underline;">${esc(r.order?.date||'')}</a></td><td class="lt-mono" style="padding:4px 6px;color:${fc};">${esc(r.valueRaw)} ${esc(r.unit)}${r.hidden?' <span style="color:'+SUB+';">(hidden)</span>':''}</td><td class="lt-mono" style="padding:4px 6px;color:${SUB};">${r.refLow!=null?r.refLow:''}${r.refLow!=null&&r.refHigh!=null?' - ':''}${r.refHigh!=null?r.refHigh:''}</td><td style="padding:4px 6px;color:${fc};">${f==='normal'?'':f}</td><td style="padding:4px 6px;">${esc(r.order?.orderingPhysician||'')}</td><td style="padding:4px 6px;">${esc(r.order?.facility||'')}</td><td style="padding:4px 6px;color:${SUB};font-size:11px;">${esc(r.order?.sourceNotes||'')}</td><td style="padding:4px 6px;color:${SUB};font-size:11px;">${esc(r.order?.contextNotes||'')}</td><td style="padding:4px 6px;color:${SUB};font-size:11px;">${esc(r.rawLabel||'')}</td><td style="padding:4px 6px;white-space:nowrap;">${(r.order&&r.order.photoCount) ? `<a href="#" class="lt-goto-source" data-order="${r.orderId}" data-count="${r.order.photoCount}" style="color:${TEAL};text-decoration:underline;font-size:11px;margin-right:8px;">Source</a>` : ''}${actionButtons}</td></tr>${editRow}${moveRow}${deleteRow}`;
              }).join('')}
              </tbody>
            </table>
          </div>` : ''}
        </div>`;
      }
    }
  }
  html += `</div>`;
  return html;
}

function editOrder(orderId, date, physician, facility, sourceNotes, contextNotes, reportedDate){
  const o = ORDERS.find(x=>x.id===orderId);
  if(!o) return;
  o.date = date || o.date;
  o.orderingPhysician = physician || '';
  o.facility = facility || '';
  o.sourceNotes = sourceNotes || '';
  o.contextNotes = contextNotes || '';
  o.reportedDate = reportedDate || '';
  saveOrders();
  editingOrderId = null;
  render();
}

let deletingOrderId = null;

async function deleteOrder(orderId){
  const o = ORDERS.find(x=>x.id===orderId);
  if(!o) return;
  try {
    if(o.photoCount){
      const paths = [];
      for(let i=0;i<o.photoCount;i++) paths.push(orderId+'/'+i+'.jpg');
      const { error: storageError } = await sb.storage.from('lab-photos').remove(paths);
      if(storageError) console.error('photo cleanup failed', storageError);
    }
    const { error } = await sb.from('orders').delete().eq('id', orderId);
    if(error){ console.error('deleteOrder error', error); return; }
  } catch(e){ console.error('deleteOrder failed', e); return; }
  ORDERS = ORDERS.filter(x=>x.id!==orderId);
  RESULTS = RESULTS.filter(x=>x.orderId!==orderId);
  deletingOrderId = null;
  expandedOrder = null;
  render();
}

async function openLightboxForOrder(orderId, photoCount){
  const photos = await loadPhotosForOrder(orderId, photoCount);
  lightboxPhotos = photos.length ? photos : ['__none__'];
  lightboxIndex = 0;
  render();
}

async function attachPhotoToOrder(orderId, file){
  try {
    let dataUrl = null;
    try { dataUrl = await resizeImageFile(file, 1200, 0.72); } catch(e){ dataUrl = null; }
    if(!dataUrl && isHeic(file)){
      try {
        const converted = await browserHeicConvert(file);
        dataUrl = await resizeImageFile(converted, 1200, 0.72);
      } catch(e){ dataUrl = null; }
    }
    if(!dataUrl){
      const b64 = await fileToBase64(file);
      const { data: fnData, error: fnError } = await sb.functions.invoke('extract-labs', {
        body: { imageBase64: b64, mediaType: 'image/heic' }
      });
      if(fnError) throw fnError;
      const payload = typeof fnData === 'string' ? JSON.parse(fnData) : fnData;
      if(!payload.convertedJpegBase64) throw new Error('server could not convert this HEIC photo');
      dataUrl = await resizeDataUrl('data:image/jpeg;base64,'+payload.convertedJpegBase64, 1200, 0.72);
    }
    const blob = await dataUrlToBlob(dataUrl);
    const o = ORDERS.find(x=>x.id===orderId) || CLINICAL_DOCS.find(x=>x.id===orderId);
    if(!o) return;
    const idx = o.photoCount || 0;
    const { error } = await sb.storage.from('lab-photos').upload(orderId+'/'+idx+'.jpg', blob, { contentType:'image/jpeg', upsert:true });
    if(error){ console.error('attach photo failed', error); return; }
    o.photoCount = idx + 1;
    if(ORDERS.includes(o)) await saveOrders(); else await saveClinicalDocs();
    render();
  } catch(e){ console.error('attach photo failed', e); }
}

function editDoc(docId, date, reportedDate, documentType, ordering, reading, additional, facility, accession, encounter, indication){
  const d = CLINICAL_DOCS.find(x=>x.id===docId);
  if(!d) return;
  d.date = date || d.date;
  d.reportedDate = reportedDate || '';
  d.documentType = documentType || '';
  d.orderingPhysician = ordering || '';
  d.readingPhysician = reading || '';
  d.additionalPhysicians = additional || '';
  d.facility = facility || '';
  d.accessionNumber = accession || '';
  d.encounterId = encounter || '';
  d.indication = indication || '';
  saveClinicalDocs();
  editingDocId = null;
  render();
}

async function deleteDoc(docId){
  const d = CLINICAL_DOCS.find(x=>x.id===docId);
  if(!d) return;
  try {
    if(d.photoCount){
      const paths = [];
      for(let i=0;i<d.photoCount;i++) paths.push(docId+'/'+i+'.jpg');
      const { error: storageError } = await sb.storage.from('lab-photos').remove(paths);
      if(storageError) console.error('doc photo cleanup failed', storageError);
    }
    const { error } = await sb.from('clinical_documents').delete().eq('id', docId);
    if(error){ console.error('deleteDoc error', error); return; }
  } catch(e){ console.error('deleteDoc failed', e); return; }
  CLINICAL_DOCS = CLINICAL_DOCS.filter(x=>x.id!==docId);
  SIGNALS = SIGNALS.filter(x=>x.documentId!==docId);
  deletingDocId = null;
  expandedDoc = null;
  render();
}

              <td style="padding:4px 6px;font-size:11px;color:${SUB};">${(s.regionTags||[]).map(esc).join(', ')}</td>
              <td style="padding:4px 6px;max-width:260px;">${esc(s.text)}${s.hasRecommendation?`<div style="color:${HIGH};font-size:11px;margin-top:2px;">&#9888; ${esc(s.recommendationText)}</div>`:''}</td>
              <td class="lt-mono" style="padding:4px 6px;">${s.measurementValue!=null?esc(s.measurementValue)+' '+esc(s.measurementUnit):''}</td>
              <td style="padding:4px 6px;">${isEditor ? `<button class="lt-sig-hide-toggle" data-signal="${s.id}" data-hidden="${s.hidden?'1':'0'}" style="background:none;border:1px solid ${LINE};padding:3px 8px;border-radius:4px;font-size:11px;color:${INK};">${s.hidden?'Unhide':'Hide'}</button>` : ''}</td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
        </div>
      </div>` : ''}
    </div>`;
  }
  html += `</div>`;
  return html;
}

      <div style="display:grid;grid-template-columns:1fr 1fr 70px 70px;gap:8px;margin-bottom:8px;">

        <input type="text" class="lt-cat-rangenote" data-id="${t.id}" value="${esc(t.rangeNote||'')}" placeholder="e.g. age-tiered threshold, not a flat range" ${isEditor?'':'disabled'} style="width:100%;padding:5px 6px;border:1px solid ${LINE};border-radius:4px;font-size:12px;margin-top:2px;"/>
      </label>

        <input type="text" class="lt-cat-tags" data-id="${t.id}" value="${(t.tags||[]).join(', ')}" placeholder="e.g. kidney, heart failure" ${isEditor?'':'disabled'} style="width:100%;padding:5px 6px;border:1px solid ${LINE};border-radius:4px;font-size:12px;margin-top:2px;"/>

function renderLogin(){
  return `<div style="max-width:360px;margin:80px auto;padding:0 16px;">
    <div class="lt-head" style="font-size:18px;font-weight:600;margin-bottom:4px;text-align:center;">Lab tracker</div>
    <div style="font-size:13px;color:${SUB};margin-bottom:20px;text-align:center;">Sign in to view or add records.</div>
    <div style="background:${CARD};border:1px solid ${LINE};border-radius:10px;padding:20px;">
      <label style="font-size:12px;color:${SUB};display:block;margin-bottom:10px;">Email
        <input type="email" id="lt-login-email" autocomplete="username" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:13px;"/>
      </label>
      <label style="font-size:12px;color:${SUB};display:block;margin-bottom:14px;">Password
        <input type="password" id="lt-login-password" autocomplete="current-password" style="width:100%;padding:8px;border:1px solid ${LINE};border-radius:6px;margin-top:4px;font-size:13px;"/>
      </label>
      <button id="lt-login-submit" style="width:100%;background:${TEAL};color:#fff;border:none;padding:10px;border-radius:8px;font-size:14px;font-weight:500;">${loggingIn ? 'Signing in...' : 'Sign in'}</button>
      ${loginError ? `<div style="margin-top:10px;font-size:12px;color:${HIGH};">${esc(loginError)}</div>` : ''}

async function doLogin(){
  const emailEl = root.querySelector('#lt-login-email');
  const passEl = root.querySelector('#lt-login-password');
  const email = emailEl ? emailEl.value.trim() : '';
  const password = passEl ? passEl.value : '';
  if(!email || !password){ loginError = 'Enter both email and password.'; render(); return; }
  loggingIn = true; loginError = ''; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  loggingIn = false;
  if(error){ loginError = 'Could not sign in -- check the email and password.'; render(); return; }
  session = data.session;
  isEditor = (session.user.app_metadata||{}).role === 'editor';
  await loadAll();
}

async function doLogout(){
  await sb.auth.signOut();
  session = null; isEditor = false;
  CATALOG = []; ORDERS = []; RESULTS = []; loaded = false;
  render();
}

function renderTopBar(){
  const roleLabel = isEditor ? 'Editor' : 'Viewer';
  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid ${LINE};background:${CARD};">
    <div class="lt-head" style="font-size:14px;font-weight:600;">Lab tracker</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:11px;color:${SUB};background:${PAPER};padding:2px 8px;border-radius:4px;">${roleLabel}</span>
      <button id="lt-logout" style="background:none;border:1px solid ${LINE};padding:5px 10px;border-radius:6px;font-size:12px;color:${INK};">Sign out</button>
    </div>
  </div>`;
}

function render(){
  if(!session){ root.innerHTML = renderLogin(); wireEvents(); return; }
  if(!loaded){ root.innerHTML = renderTopBar() + `<div style="padding:40px;text-align:center;color:${SUB};font-size:14px;">Loading...</div>`; return; }
  if(activeTab==='add' && !isEditor) activeTab = 'results';
  if(activeTab==='adddoc' && !isEditor) activeTab = 'documents';
  let body = activeTab==='add' ? renderAddTab()
    : activeTab==='results' ? renderResultsTab()
    : activeTab==='reports' ? renderReportsTab()
    : activeTab==='catalog' ? renderCatalogTab()
    : activeTab==='adddoc' ? renderAddDocTab()
    : activeTab==='documents' ? renderDocumentsTab()
    : renderCatalogTab();
  root.innerHTML = renderTopBar() + `
    <div style="border-bottom:1px solid ${LINE};padding:0 4px;display:flex;gap:4px;flex-wrap:wrap;">
      ${isEditor ? tabBtn('add','Add report') : ''}
      ${tabBtn('results','Results')}
      ${tabBtn('reports','Lab reports')}
      ${tabBtn('catalog','Test catalog')}
      <div style="width:1px;background:${LINE};margin:6px 2px;"></div>
      ${isEditor ? tabBtn('adddoc','Add document') : ''}
      ${tabBtn('documents','Documents')}
    </div>
    ${body}
    ${renderLightbox()}
  `;
  wireEvents();
}

function wireEvents(){
  const loginBtn = root.querySelector('#lt-login-submit');
  if(loginBtn) loginBtn.onclick = doLogin;
  const loginPass = root.querySelector('#lt-login-password');
  if(loginPass) loginPass.onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
  const logoutBtn = root.querySelector('#lt-logout');
  if(logoutBtn) logoutBtn.onclick = doLogout;
  if(!session) return;

  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ activeTab=b.getAttribute('data-tab'); render(); });

  const uploadBtn = root.querySelector('#lt-upload-btn');
  const fileInput = root.querySelector('#lt-file-input');
  if(uploadBtn && fileInput){
    uploadBtn.onclick = ()=> fileInput.click();
    fileInput.onchange = (e)=>{ const f = e.target.files[0]; if(f) extractFromImage(f); };
  }
  const manualBtn = root.querySelector('#lt-manual-btn');
  if(manualBtn) manualBtn.onclick = startManualEntry;
  const pasteBtn = root.querySelector('#lt-paste-import');
  if(pasteBtn) pasteBtn.onclick = ()=> importPastedJson(false);

  const metaDate = root.querySelector('#lt-meta-date');
  if(metaDate) metaDate.onchange = e=>{ pendingExtraction.reportDate = e.target.value; };
  const metaReportedDate = root.querySelector('#lt-meta-reported-date');
  if(metaReportedDate) metaReportedDate.onchange = e=>{ pendingExtraction.reportedDate = e.target.value; };
  const metaPhys = root.querySelector('#lt-meta-phys');
  if(metaPhys) metaPhys.onchange = e=>{ pendingExtraction.orderingPhysician = e.target.value; };
  const metaFac = root.querySelector('#lt-meta-facility');
  if(metaFac) metaFac.onchange = e=>{ pendingExtraction.facility = e.target.value; };
  const metaSourceNotes = root.querySelector('#lt-meta-source-notes');
  if(metaSourceNotes) metaSourceNotes.onchange = e=>{ pendingExtraction.sourceNotes = e.target.value; };
  const metaContextNotes = root.querySelector('#lt-meta-context-notes');
  if(metaContextNotes) metaContextNotes.onchange = e=>{ pendingExtraction.contextNotes = e.target.value; };

  root.querySelectorAll('tr[data-row]').forEach(tr=>{
    const rowId = tr.getAttribute('data-row');
    const row = pendingExtraction.rows.find(r=>r.rowId===rowId);
    const inc = tr.querySelector('.lt-row-include'); if(inc) inc.onchange = e=>{ row.include = e.target.checked; };
    const lbl = tr.querySelector('.lt-row-label'); if(lbl) lbl.oninput = e=>{ row.rawLabel = e.target.value; };
    const match = tr.querySelector('.lt-row-match'); if(match) match.onchange = e=>{ row.matchedTestId = e.target.value; render(); };
    const val = tr.querySelector('.lt-row-value'); if(val) val.oninput = e=>{ row.value = e.target.value; };
    const unit = tr.querySelector('.lt-row-unit'); if(unit) unit.oninput = e=>{ row.unit = e.target.value; };
    const rl = tr.querySelector('.lt-row-reflow'); if(rl) rl.oninput = e=>{ row.refLow = e.target.value; };
    const rh = tr.querySelector('.lt-row-refhigh'); if(rh) rh.oninput = e=>{ row.refHigh = e.target.value; };
    const rm = tr.querySelector('.lt-row-remove'); if(rm) rm.onclick = ()=>{ pendingExtraction.rows = pendingExtraction.rows.filter(r=>r.rowId!==rowId); render(); };
  });
  const addRowBtn = root.querySelector('#lt-add-row'); if(addRowBtn) addRowBtn.onclick = addBlankRow;
  const uploadAppendBtn = root.querySelector('#lt-upload-append-btn');
  const fileInputAppend = root.querySelector('#lt-file-input-append');
  if(uploadAppendBtn && fileInputAppend){
    uploadAppendBtn.onclick = ()=> fileInputAppend.click();
    fileInputAppend.onchange = (e)=>{ const f = e.target.files[0]; if(f) extractFromImage(f, true); };
  }
  const pasteAppendBtn = root.querySelector('#lt-paste-import-append');
  if(pasteAppendBtn) pasteAppendBtn.onclick = ()=>{
    const el = root.querySelector('#lt-paste-json-append');
    const raw = el ? el.value.trim() : '';
    if(!raw) return;
    try {
      const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());
      pendingExtraction.rows = pendingExtraction.rows.concat(buildRowsFromParsed(parsed));
      render();
    } catch(e){ extractError = 'IMPORT:That did not look like valid extracted data.'; render(); }
  };
  const saveBtn = root.querySelector('#lt-save-extraction'); if(saveBtn) saveBtn.onclick = saveExtraction;
  const cancelBtn = root.querySelector('#lt-cancel-extraction'); if(cancelBtn) cancelBtn.onclick = cancelExtraction;

  root.querySelectorAll('.lt-test-row').forEach(el=>{
    el.onclick = ()=>{ const id = el.getAttribute('data-test'); expandedTest = expandedTest===id ? null : id; movingResultId = null; editingResultId = null; deletingResultId = null; render(); };
  });
  root.querySelectorAll('.lt-move-start').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); movingResultId = el.getAttribute('data-result'); editingResultId = null; render(); };
  });
  root.querySelectorAll('.lt-move-cancel').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); movingResultId = null; render(); };
  });
  root.querySelectorAll('.lt-move-confirm').forEach(el=>{
    el.onclick = (e)=>{

      if(sel) moveResult(resultId, sel.value);
    };
  });
  root.querySelectorAll('.lt-edit-start').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); editingResultId = el.getAttribute('data-result'); movingResultId = null; render(); };
  });
  root.querySelectorAll('.lt-edit-cancel').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); editingResultId = null; render(); };

  root.querySelectorAll('.lt-edit-confirm').forEach(el=>{
    el.onclick = (e)=>{

      const v = root.querySelector(`.lt-edit-value[data-result="${resultId}"]`);
      const u = root.querySelector(`.lt-edit-unit[data-result="${resultId}"]`);
      const rl = root.querySelector(`.lt-edit-reflow[data-result="${resultId}"]`);
      const rh = root.querySelector(`.lt-edit-refhigh[data-result="${resultId}"]`);

  root.querySelectorAll('.lt-hide').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); e.preventDefault(); hideResult(el.getAttribute('data-result'), true); };
  });
  root.querySelectorAll('.lt-unhide').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); e.preventDefault(); hideResult(el.getAttribute('data-result'), false); };
  });
  root.querySelectorAll('.lt-delete-start').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deletingResultId = el.getAttribute('data-result'); render(); };
  });
  root.querySelectorAll('.lt-delete-cancel').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deletingResultId = null; render(); };
  });
  root.querySelectorAll('.lt-delete-confirm').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deleteResult(el.getAttribute('data-result')); };

  root.querySelectorAll('.lt-toggle-hidden').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation(); e.preventDefault();
      const testId = el.getAttribute('data-test');

      render();

  root.querySelectorAll('.lt-cat-domain').forEach(el=>{

  root.querySelectorAll('.lt-cat-reflow').forEach(el=>{

  root.querySelectorAll('.lt-cat-refhigh').forEach(el=>{

  });
  root.querySelectorAll('.lt-cat-rangenote').forEach(el=>{

  root.querySelectorAll('.lt-cat-tags').forEach(el=>{
    el.onchange = e=>{ const t = CATALOG.find(c=>c.id===el.getAttribute('data-id')); if(t){ t.tags = e.target.value.split(',').map(s=>s.trim()).filter(Boolean); saveCatalog(); } };
  });
  root.querySelectorAll('.lt-alias-chip').forEach(el=>{
    el.onclick = ()=>{
      const t = CATALOG.find(c=>c.id===el.getAttribute('data-testid'));
      const alias = el.getAttribute('data-alias');
      if(t){

  if(docUploadAppendBtn && docFileInputAppend){

    docFileInputAppend.onchange = (e)=>{ const f = e.target.files[0]; if(f) extractDocumentFromImage(f, true); };

    ['lt-doc-facility','facility'], ['lt-doc-ordering','orderingPhysician'], ['lt-doc-reading','readingPhysician'],
    ['lt-doc-additional','additionalPhysicians'], ['lt-doc-accession','accessionNumber'],
    ['lt-doc-encounter','encounterId'], ['lt-doc-indication','indication'],
    ['lt-doc-findings','findingsText'], ['lt-doc-impression','impressionText']
  ];
  for(const [id, field] of docMetaFields){
    const el = root.querySelector('#'+id);
    if(el) el.onchange = (e)=>{ if(pendingDocExtraction) pendingDocExtraction[field] = e.target.value; };
  }
  const addSignalBtn = root.querySelector('#lt-add-signal-row');
  if(addSignalBtn) addSignalBtn.onclick = ()=>{
    pendingDocExtraction.signalRows.push({
      rowId: uid(), include:true, type:'finding', domain:'', subdomain:'', structureTag:'',
      regionTags:[], isAncillary:false, isNegative:false, text:'', measurementValue:'',
      measurementUnit:'', measurementLabel:'', hasRecommendation:false, recommendationText:''
    });
    render();
  };
  const saveDocBtn = root.querySelector('#lt-save-doc-extraction');
  if(saveDocBtn) saveDocBtn.onclick = saveDocExtraction;
  const cancelDocBtn = root.querySelector('#lt-cancel-doc-extraction');
  if(cancelDocBtn) cancelDocBtn.onclick = ()=>{ pendingDocExtraction = null; docExtractError=''; render(); };

  // Signal card fields -- mutate in place, no full re-render needed except for toggles/removal
  function findSigRow(rowId){ return pendingDocExtraction ? pendingDocExtraction.signalRows.find(r=>r.rowId===rowId) : null; }
  root.querySelectorAll('.lt-sig-include').forEach(el=>{ el.onchange = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r){ r.include=e.target.checked; render(); } }; });
  root.querySelectorAll('.lt-sig-type').forEach(el=>{ el.onchange = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.type=e.target.value; }; });
  root.querySelectorAll('.lt-sig-domain').forEach(el=>{ el.oninput = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.domain=e.target.value; }; });
  root.querySelectorAll('.lt-sig-subdomain').forEach(el=>{ el.oninput = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.subdomain=e.target.value; }; });
  root.querySelectorAll('.lt-sig-structure').forEach(el=>{ el.oninput = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.structureTag=e.target.value; }; });
  root.querySelectorAll('.lt-sig-region').forEach(el=>{
    el.onclick = ()=>{
      const r = findSigRow(el.getAttribute('data-row'));
      const region = el.getAttribute('data-region');
      if(!r) return;
      if(r.regionTags.includes(region)) r.regionTags = r.regionTags.filter(x=>x!==region);
      else r.regionTags.push(region);
      render();
    };
  });
  root.querySelectorAll('.lt-sig-ancillary').forEach(el=>{ el.onchange = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.isAncillary=e.target.checked; }; });
  root.querySelectorAll('.lt-sig-negative').forEach(el=>{ el.onchange = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.isNegative=e.target.checked; }; });
  root.querySelectorAll('.lt-sig-text').forEach(el=>{ el.oninput = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.text=e.target.value; }; });
  root.querySelectorAll('.lt-sig-measval').forEach(el=>{ el.oninput = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.measurementValue=e.target.value; }; });
  root.querySelectorAll('.lt-sig-measunit').forEach(el=>{ el.oninput = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.measurementUnit=e.target.value; }; });
  root.querySelectorAll('.lt-sig-measlabel').forEach(el=>{ el.oninput = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.measurementLabel=e.target.value; }; });
  root.querySelectorAll('.lt-sig-hasrec').forEach(el=>{ el.onchange = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.hasRecommendation=e.target.checked; }; });
  root.querySelectorAll('.lt-sig-rectext').forEach(el=>{ el.oninput = e=>{ const r=findSigRow(el.getAttribute('data-row')); if(r) r.recommendationText=e.target.value; }; });
  root.querySelectorAll('.lt-sig-remove').forEach(el=>{
    el.onclick = ()=>{ pendingDocExtraction.signalRows = pendingDocExtraction.signalRows.filter(r=>r.rowId!==el.getAttribute('data-row')); render(); };
  });

  // --- Documents tab ---
  root.querySelectorAll('.lt-doc-row').forEach(el=>{
    el.onclick = ()=>{ const id = el.getAttribute('data-doc'); expandedDoc = expandedDoc===id ? null : id; editingDocId = null; deletingDocId = null; render(); };
  });
  root.querySelectorAll('.lt-doc-edit-start').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); editingDocId = el.getAttribute('data-doc'); render(); };
  });
  root.querySelectorAll('.lt-doc-edit-cancel').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); editingDocId = null; render(); };
  });
  root.querySelectorAll('.lt-doc-edit-save').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const docId = el.getAttribute('data-doc');
      const g = cls => root.querySelector(`.${cls}[data-doc="${docId}"]`);
      editDoc(docId,
        g('lt-doc-edit-date')?.value, g('lt-doc-edit-reported')?.value, g('lt-doc-edit-type')?.value,
        g('lt-doc-edit-ordering')?.value, g('lt-doc-edit-reading')?.value, g('lt-doc-edit-additional')?.value,
        g('lt-doc-edit-facility')?.value, g('lt-doc-edit-accession')?.value, g('lt-doc-edit-encounter')?.value,
        g('lt-doc-edit-indication')?.value);
    };
  });
  root.querySelectorAll('.lt-doc-delete-start').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deletingDocId = el.getAttribute('data-doc'); render(); };
  });
  root.querySelectorAll('.lt-doc-delete-cancel').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deletingDocId = null; render(); };
  });
  root.querySelectorAll('.lt-doc-delete-confirm').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deleteDoc(el.getAttribute('data-doc')); };
  });
  root.querySelectorAll('.lt-sig-hide-toggle').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const sig = SIGNALS.find(s=>s.id===el.getAttribute('data-signal'));
      if(sig){ sig.hidden = !sig.hidden; saveSignals(); render(); }
    };
  });
}

(async function bootstrap(){
  const { data } = await sb.auth.getSession();
  if(data && data.session){
    session = data.session;
    isEditor = (session.user.app_metadata||{}).role === 'editor';
    await loadAll();
  } else {
    render();
  }
})();
})();
</script>
</body>
</html>
